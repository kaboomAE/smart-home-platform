<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#f7f6f2"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a5560"/></marker></defs>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1d2630">Platform overview</text>
  <rect x="30" y="64" width="560" height="420" rx="14" fill="#ffffff" stroke="#c9cdd2"/>
  <text x="50" y="92" font-size="13" font-weight="700" fill="#5b6670" letter-spacing="1">CLOUD · ONE VPS · DOCKER COMPOSE</text>
  <rect x="55" y="110" width="240" height="130" rx="10" fill="#e8f1ef" stroke="#2f7d72"/>
  <text x="70" y="138" font-size="16" font-weight="700" fill="#1d2630">Planner</text>
  <text x="70" y="160" font-size="12.5" fill="#33404c">React 19 · FastAPI · PostgreSQL 17</text>
  <text x="70" y="180" font-size="12.5" fill="#33404c">Floor plans, device placement,</text>
  <text x="70" y="198" font-size="12.5" fill="#33404c">RF coverage, AI assistant,</text>
  <text x="70" y="216" font-size="12.5" fill="#33404c">quotes and bilingual PDFs</text>
  <rect x="325" y="110" width="240" height="130" rx="10" fill="#e8f1ef" stroke="#2f7d72"/>
  <text x="340" y="138" font-size="16" font-weight="700" fill="#1d2630">Fleet manager</text>
  <text x="340" y="160" font-size="12.5" fill="#33404c">Dashboard for every home</text>
  <text x="340" y="180" font-size="12.5" fill="#33404c">Health, alerts, remote support</text>
  <text x="340" y="198" font-size="12.5" fill="#33404c">Knows which plan each home</text>
  <text x="340" y="216" font-size="12.5" fill="#33404c">was built from</text>
  <line x1="295" y1="168" x2="323" y2="168" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="325" y1="190" x2="297" y2="190" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="262" font-size="11.5" fill="#5b6670">shared sign-in · plan-to-home link</text>
  <rect x="55" y="290" width="240" height="80" rx="10" fill="#f1efe8" stroke="#8f8368"/>
  <text x="70" y="318" font-size="16" font-weight="700" fill="#1d2630">Online store</text>
  <text x="70" y="340" font-size="12.5" fill="#33404c">Catalogue pushed by background</text>
  <text x="70" y="358" font-size="12.5" fill="#33404c">jobs; Arabic copy registered</text>
  <line x1="120" y1="240" x2="120" y2="288" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="325" y="290" width="240" height="80" rx="10" fill="#f1efe8" stroke="#8f8368"/>
  <text x="340" y="318" font-size="16" font-weight="700" fill="#1d2630">CI/CD runner on the server</text>
  <text x="340" y="340" font-size="12.5" fill="#33404c">The dev deploy is the health</text>
  <text x="340" y="358" font-size="12.5" fill="#33404c">gate before production rolls</text>
  <rect x="55" y="395" width="510" height="70" rx="10" fill="#fdf1e7" stroke="#c46a1c"/>
  <text x="70" y="422" font-size="16" font-weight="700" fill="#1d2630">Monitoring, partly off the server</text>
  <text x="70" y="444" font-size="12.5" fill="#33404c">An edge worker checks from outside, a timer reports from inside; each watches the other</text>
  <rect x="650" y="64" width="280" height="250" rx="14" fill="#ffffff" stroke="#c9cdd2"/>
  <text x="670" y="92" font-size="13" font-weight="700" fill="#5b6670" letter-spacing="1">EACH HOME</text>
  <rect x="670" y="110" width="240" height="180" rx="10" fill="#e8eef7" stroke="#3b6aa8"/>
  <text x="685" y="138" font-size="16" font-weight="700" fill="#1d2630">Home Assistant + agent</text>
  <text x="685" y="162" font-size="12.5" fill="#33404c">One outbound WebSocket:</text>
  <text x="685" y="180" font-size="12.5" fill="#33404c">no open ports, no VPN</text>
  <text x="685" y="202" font-size="12.5" fill="#33404c">Health snapshot every 60 s</text>
  <text x="685" y="224" font-size="12.5" fill="#33404c">Allowlisted commands only,</text>
  <text x="685" y="242" font-size="12.5" fill="#33404c">refused by default; sensitive</text>
  <text x="685" y="260" font-size="12.5" fill="#33404c">ones need the homeowner's consent</text>
  <line x1="668" y1="200" x2="567" y2="200" stroke="#4a5560" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="590" y="192" font-size="11.5" fill="#5b6670">outbound</text>
  <rect x="650" y="340" width="280" height="144" rx="14" fill="#ffffff" stroke="#c9cdd2"/>
  <text x="670" y="368" font-size="13" font-weight="700" fill="#5b6670" letter-spacing="1">INSTALLER</text>
  <text x="670" y="394" font-size="16" font-weight="700" fill="#1d2630">Onboarding apps</text>
  <text x="670" y="416" font-size="12.5" fill="#33404c">Windows (Electron) + Android (Expo)</text>
  <text x="670" y="436" font-size="12.5" fill="#33404c">Fresh box to enrolled home:</text>
  <text x="670" y="454" font-size="12.5" fill="#33404c">claim, install, pair, commission,</text>
  <text x="670" y="472" font-size="12.5" fill="#33404c">resumable at every step</text>
  <line x1="790" y1="338" x2="790" y2="292" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
